appId: com.oasis.gtd
productName: Oasis GTD
copyright: Copyright © 2024
directories:
  buildResources: resources
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!mcp/**'
  - '!.mcp.json'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.*}'
  - '!tailwind.config.js'
  - '!postcss.config.js'
  # Repository-only assets: the README screenshot and the icon notes are not
  # used by the app. The icons themselves (icon.ico / icon.png) are shipped
  # through extraResources, because the app loads them at runtime.
  - '!resources/Oasis_GTD_iQfYzpW4Wa.png'
  - '!resources/README.txt'
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
  # better-sqlite3 loads its native addon through these two pure-JS helpers.
  # The MCP server runs as a separate process OUTSIDE app.asar (plain node
  # cannot read inside the archive), so they have to be unpacked too —
  # otherwise the endpoint cannot start on a machine without Node.js, where it
  # falls back to the app's own runtime and this driver.
  - node_modules/bindings/**
  - node_modules/file-uri-to-path/**

extraResources:
  - from: resources/icon.ico
    to: icon.ico
  # The Linux window icon (see src/main/index.ts) is loaded from the
  # executable's directory in a packaged build.
  - from: resources/icon.png
    to: icon.png
  # Self-contained MCP server bundle the app spawns as `node server.mjs --http`
  # for agents on the LAN (see src/main/mcp-http.ts). Plain node cannot read
  # files inside app.asar, so it must ship unpacked, next to the executable.
  - from: resources/mcp
    to: mcp

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: Oasis-GTD-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Oasis GTD

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: resources/icon.icns
  artifactName: Oasis-GTD-${version}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: resources/icon.png
  artifactName: Oasis-GTD-${version}.${ext}
